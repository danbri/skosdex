name: skosdex

# Brings up the bundled dataset behind a SPARQL endpoint (Oxigraph), a Solr
# index, and a small web frontend that proxies to both.
#
#   npm run build           # produce dist/bundle.nq + dist/solr-docs.json
#   docker compose up --build
#
#   web frontend  -> http://localhost:8080
#   SPARQL query  -> http://localhost:7878/query
#   Solr admin    -> http://localhost:8983/solr

services:
  # SPARQL endpoint with the normalized N-Quads baked into the image.
  sparql:
    build:
      context: .
      dockerfile: docker/sparql/Dockerfile
    image: skosdex/sparql:latest
    ports:
      - "7878:7878"
    restart: unless-stopped

  # Full-text / faceted index over the SKOS concepts.
  solr:
    image: solr:9
    ports:
      - "8983:8983"
    command: solr-precreate skos
    volumes:
      - solr-data:/var/solr
    restart: unless-stopped

  # One-shot: waits for Solr, then posts the chunked dist/solr-parts/*.json into
  # the core. We post the parts (50k docs each) rather than the single
  # dist/solr-docs.json: per-language label subfields make the full-corpus file
  # multi-GB, which a single --data-binary POST can't stream into Solr's default
  # heap. A final commit makes everything searchable at once.
  solr-init:
    image: curlimages/curl:latest
    depends_on:
      - solr
    volumes:
      - ./dist:/dist:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        until curl -sf http://solr:8983/solr/skos/admin/ping >/dev/null 2>&1; do
          echo "waiting for solr..."; sleep 2;
        done;
        for p in /dist/solr-parts/part-*.json; do
          echo "posting $p ...";
          curl -sf "http://solr:8983/solr/skos/update"
            -H 'Content-Type: application/json' --data-binary @"$p" >/dev/null
            || { echo "FAILED posting $p"; exit 1; };
        done;
        curl -sf "http://solr:8983/solr/skos/update?commit=true" >/dev/null
        && echo "indexed $(cat /dist/solr-parts/part-*.json | grep -c '\"id\"') docs in parts";
    restart: "no"

  # Static frontend + same-origin reverse proxy to sparql and solr.
  web:
    image: nginx:alpine
    depends_on:
      - sparql
      - solr
    ports:
      - "8080:80"
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  solr-data:
