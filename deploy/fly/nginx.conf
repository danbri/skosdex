# skosdex front proxy: one origin (443 via Fly edge) multiplexing
#   /            -> SKOS entrance page (static, /opt/skosdex/www)
#   /manifest.json -> per-scheme license/provenance manifest (from the image)
#   /query       -> Oxigraph SPARQL (GET+POST), path-compatible with clients
#   /sparql/     -> Oxigraph root (its built-in query UI)
#   /solr/skos/select -> Solr search, READ-ONLY (GET only; no /update)
# Shared IPv4 on Fly routes only 80/443, so everything rides one port.
server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/foafpub-routes.conf;

    root /opt/skosdex/www;
    index index.html;

    location = /manifest.json {
        alias /seed/manifest.json;
        add_header Access-Control-Allow-Origin *;
    }

    location = /query {
        proxy_pass http://127.0.0.1:7878/query;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
        client_max_body_size 2m;
    }

    location /sparql/ {
        proxy_pass http://127.0.0.1:7878/;
        proxy_set_header Host $host;
    }

    location = /solr/skos/select {
        # read-only: search yes, /update never. POST is allowed so the client can
        # send large queries (a scheme-filter fq over hundreds of vocabularies
        # blows past Safari/iOS's fetch URL-length limit on GET); POST to /select
        # is still pure search — /update is a different path and never proxied.
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8983/solr/skos/select;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # Realtime autocomplete: GET /autocomplete?q=term
    # Solr-compatible response (response.docs[]) whose docs are RDF-shaped:
    # id = concept URI, scheme = named-graph URI, exactMatch/closeMatch =
    # cross-scheme mapping URIs, notation = classification codes.
    location = /autocomplete {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8983/solr/skos/select?wt=json&rows=10&defType=edismax&qf=exactLabel%5E20%20prefLabel%5E3%20altLabel&fl=id,prefLabel,altLabel,definition,notation,scheme,exactMatch,closeMatch,broadMatch,narrowMatch,relatedMatch,related,sameAs,focus,mapping&q=$arg_q%20OR%20$arg_q*;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # Embeddings similarity API: KNN over the combined MiniLM space, served by
    # the node process on :8088 (tools/embed_api.mjs). Read-only, CORS-open.
    #   GET /api/health  /api/schemes  /api/concept?id=  /api/similar?id=&k=&cross=
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # Raw vectors + layouts as a static API (float16 blobs, ids/labels, UMAP):
    # CORS-open so other origins can fetch and run their own KNN client-side.
    # Volume-first: the big .emb.f16 vectors are synced to /data/embeddings at
    # boot (not baked); the small layouts/metas/index are baked in the image. Try
    # the volume, then fall back to the image — so galaxies render immediately and
    # vectors light up as they arrive (a not-yet-synced vector simply 404s, which
    # the front-end handles gracefully).
    location /embeddings/ {
        add_header Access-Control-Allow-Origin *;
        root /data;                      # /data/embeddings/<file> (synced vectors)
        try_files $uri @emb_baked;
    }
    location @emb_baked {
        add_header Access-Control-Allow-Origin *;
        root /opt/skosdex/www;           # /opt/skosdex/www/embeddings/<file> (baked)
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
