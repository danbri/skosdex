# Discussion application code/data remain on the persistent volume. Routing is
# part of the image so normal SKOSDEX deployments cannot discard it.
location = /.well-known/lws-configuration/foafpub {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    access_log off;
}
location = /.well-known/oauth-authorization-server/foafpub {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    access_log off;
}
location = /foafpub { return 308 https://skosdex.org/foafpub/$is_args$args; }
location ^~ /foafpub/ {
    if ($host != "skosdex.org") { return 308 https://skosdex.org$request_uri; }
    if ($http_x_forwarded_proto = "http") { return 308 https://skosdex.org$request_uri; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header Fly-Client-IP $http_fly_client_ip;
    client_max_body_size 64k;
    proxy_read_timeout 30s;
    access_log off;
}
