# fly.io app config for skosdex: Oxigraph (SPARQL) + Solr on one machine,
# data on a persistent volume. Deploy with `flyctl deploy` (CI does this).
#
# First time only:
#   flyctl apps create skosdex
#   flyctl volumes create skosdex_data --size 10 --region <region>
#   flyctl secrets ...        # (none required for read-only serving)

app = "skosdex"
primary_region = "iad"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  SKOSDEX_DATA = "/data"

# Persistent volume holds the loaded Oxigraph store + Solr core, so reboots
# don't re-seed the 37.8M-quad corpus.
[mounts]
  source = "skosdex_data"
  destination = "/data"

# SPARQL endpoint (Oxigraph).
[[services]]
  internal_port = 7878
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 7878
    handlers = ["http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    method = "get"
    path = "/query?query=ASK%7B%7D"

# Solr.
[[services]]
  internal_port = 8983
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8983
    handlers = ["http"]

# 37.8M triples in RocksDB + a Solr core need real memory.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
