# fly.io app config for skosdex: Oxigraph (SPARQL) + Solr on one machine,
# data on a persistent volume. Deploy via CI (`.github/workflows/deploy-fly.yml`),
# which self-bootstraps the app + volume — no manual flyctl needed.

app = "skosdex"
primary_region = "iad"

[build]
  # Resolved relative to this fly.toml's directory (deploy/fly/). The build
  # CONTEXT is the repo root (pass `.` to `flyctl deploy`), so the Dockerfile's
  # `COPY dist/...` paths work.
  dockerfile = "Dockerfile"

[env]
  SKOSDEX_DATA = "/data"

# Persistent volume holds the loaded Oxigraph store + Solr core, so reboots
# don't re-seed the ~47.7M-quad corpus.
[mounts]
  source = "skosdex_data"
  destination = "/data"

# SPARQL endpoint (Oxigraph).
[[services]]
  internal_port = 7878
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 7878
    handlers = ["http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    method = "get"
    path = "/query?query=ASK%7B%7D"

# Solr.
[[services]]
  internal_port = 8983
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8983
    handlers = ["http"]

# ~47.7M triples in RocksDB + a Solr JVM core need real memory; the first-boot
# seed (bundle load + Solr index post) is the peak. 8GB gives headroom.
[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"
