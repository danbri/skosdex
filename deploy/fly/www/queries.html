<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skosdex — SPARQL cookbook</title>
<style>
 *{box-sizing:border-box} body{font:15px/1.55 system-ui,sans-serif;margin:0;color:#1a1a1a;background:#f4f6f8}
 header{background:#1f2933;color:#fff;padding:1.1rem 1.4rem}
 header h1{margin:0;font-size:1.25rem} header p{margin:.3rem 0 0;color:#9aa5b1;font-size:.9rem}
 header a{color:#7cc4fa;text-decoration:none}
 .wrap{max-width:920px;margin:0 auto;padding:1.3rem}
 .card{background:#fff;border:1px solid #e1e7ed;border-radius:10px;margin:0 0 1.1rem;overflow:hidden}
 .card h2{font-size:1.02rem;margin:0;padding:.7rem .9rem .1rem}
 .card .why{color:#52606d;font-size:.88rem;padding:0 .9rem .5rem;margin:0}
 .card pre{background:#0f172a;color:#e2e8f0;font-size:.8rem;line-height:1.45;margin:0;padding:.8rem .9rem;overflow-x:auto;white-space:pre}
 .bar{display:flex;gap:.5rem;padding:.55rem .9rem;background:#f8fafc;border-top:1px solid #eef2f6}
 .bar button{padding:.35rem .8rem;border:1px solid #cbd2d9;border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:.85rem}
 .bar button.run{background:#2563eb;border-color:#2563eb;color:#fff}
 .bar .note{margin-left:auto;color:#9aa5b1;font-size:.78rem;align-self:center}
 .out{padding:.4rem .9rem .8rem;display:none}
 .out table{border-collapse:collapse;width:100%;font-size:.8rem}
 .out th,.out td{border:1px solid #e4e7eb;padding:.25rem .45rem;text-align:left;word-break:break-all}
 .out th{background:#f0f4f8}
 .out .err{color:#b91c1c}
 .sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#52606d;margin:1.6rem 0 .6rem}
</style>
</head>
<body>
<header>
 <h1>SPARQL cookbook</h1>
 <p>Canned queries against the live corpus — every one checked by <code>node scripts/check.mjs</code>. <a href="/">← search UI</a> · <a href="/sparql/">raw SPARQL UI</a> · <a href="/query">POST /query</a></p>
</header>
<div class="wrap" id="list"></div>
<script type="module">
// Queries live in queries.js (shared with scripts/check.mjs) so the cookbook
// and its integrity check can never drift apart.
import { QUERIES } from './queries.js';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=document.getElementById('list');
let i=0;
for(const e of QUERIES){
  if(e.sec){ list.insertAdjacentHTML('beforeend',`<div class="sec">${esc(e.sec)}</div>`); continue; }
  const id='q'+(i++);
  list.insertAdjacentHTML('beforeend',`<div class="card">
    <h2>${esc(e.title)}</h2><p class="why">${esc(e.why)}</p>
    <pre id="${id}-src">${esc(e.q)}</pre>
    <div class="bar">
      <button class="run" onclick="run('${id}')">Run</button>
      <button onclick="copyQ('${id}')">Copy</button>
      ${e.slow?'<span class="note">slow: full-corpus scan, ~30s</span>':''}
    </div>
    <div class="out" id="${id}-out"></div></div>`);
}
async function run(id){
  const q=document.getElementById(id+'-src').textContent;
  const out=document.getElementById(id+'-out');
  out.style.display='block'; out.innerHTML='<span class="why">running…</span>';
  try{
    const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/sparql-query','Accept':'application/sparql-results+json'},body:q});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const vars=j.head.vars, rows=j.results.bindings;
    out.innerHTML=`<table><tr>${vars.map(v=>'<th>'+esc(v)+'</th>').join('')}</tr>`+
      rows.slice(0,50).map(b=>'<tr>'+vars.map(v=>'<td>'+esc(b[v]?.value??'')+'</td>').join('')+'</tr>').join('')+
      `</table><div class="why">${rows.length} row(s)${rows.length>50?' (showing 50)':''}</div>`;
  }catch(err){ out.innerHTML='<span class="err">'+esc(err.message)+'</span>'; }
}
function copyQ(id){ navigator.clipboard.writeText(document.getElementById(id+'-src').textContent); }
// inline onclick handlers resolve against window
window.run=run; window.copyQ=copyQ;
</script>
</body>
</html>
