<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skosdex galaxy — a vocabulary in space</title>
<style>
  :root{ --fg:#e8eefc; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060c;color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  #bg{position:fixed;inset:0;background:radial-gradient(120% 120% at 50% 35%,#0c1330 0%,#070a18 45%,#04050b 100%)}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .panel{position:fixed;background:rgba(10,14,30,.62);border:1px solid rgba(120,140,200,.18);
    border-radius:12px;backdrop-filter:blur(7px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #head{top:14px;left:14px;padding:.5rem .7rem;max-width:min(60vw,420px)}
  #head h1{margin:0;font-size:1rem;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:.4rem}
  #head p{margin:.4rem 0 0;color:#9fb0d8;font-size:.82rem}
  #head a{color:#8ab4ff;text-decoration:none} #head a:hover{text-decoration:underline}
  #head .sub{color:#7b88b0;font-size:.8rem;font-weight:400}
  #about[hidden]{display:none}
  .ibtn{margin-left:auto;background:transparent;border:0;color:#7b88b0;font-size:.95rem;cursor:pointer;padding:0 .1rem;line-height:1}
  .ibtn:hover,.ibtn.on{color:#8ab4ff}
  /* galaxy switcher: an obvious labelled dropdown (caret + pill) so it's clear
     which vocabulary is loaded and that you can switch it */
  #scheme{color:var(--fg);font:inherit;font-weight:650;letter-spacing:.2px;cursor:pointer;
    -webkit-appearance:none;appearance:none;max-width:46vw;
    border:1px solid rgba(130,150,210,.4);border-radius:8px;padding:.16rem 1.5rem .16rem .55rem;
    background:rgba(120,140,200,.16) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' fill='none' stroke='%238ab4ff' stroke-width='1.6'><path d='M1 1l4.5 4.5L10 1'/></svg>") no-repeat right .5rem center}
  #scheme:hover,#scheme:focus{background-color:rgba(120,140,200,.3);border-color:#8ab4ff;outline:none}
  #scheme option{background:#0a0f22;color:var(--fg);font-weight:500}
  #head .vlabel{color:#7b88b0;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;margin-right:.15rem}
  #ctrl{top:14px;right:14px;padding:.55rem;display:flex;gap:.5rem;align-items:center}
  #ctrl input{width:150px;background:#0a0f22;border:1px solid #2a3358;border-radius:8px;color:var(--fg);
    padding:.35rem .55rem;font-size:.84rem}
  #ctrl input::placeholder{color:#6b78a0}
  .seg{display:inline-flex;border:1px solid #2a3358;border-radius:8px;overflow:hidden}
  .seg button{background:#0a0f22;border:0;color:#aeb9da;padding:.35rem .7rem;font-size:.84rem;cursor:pointer}
  .seg button.on{background:#2f6bff;color:#fff}
  .btn{background:#0a0f22;border:1px solid #2a3358;border-radius:8px;color:#aeb9da;padding:.35rem .6rem;font-size:.84rem;cursor:pointer}
  .btn:hover{background:#141b38}
  #legend{left:14px;bottom:14px;padding:.6rem .7rem;max-height:46vh;overflow:auto;width:240px}
  #legend.collapsed{overflow:visible}
  #legend.collapsed #legitems{display:none}
  #legend h2{margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8597c6;font-weight:600;
    cursor:pointer;user-select:none;display:flex;align-items:center;gap:.4rem}
  #legend:not(.collapsed) h2{margin-bottom:.45rem}
  #legend h2 .caret{font-size:.6rem;color:#6b78a0;transition:transform .15s}
  #legend.collapsed h2 .caret{transform:rotate(-90deg)}
  .lg{display:flex;align-items:center;gap:.5rem;padding:.16rem .28rem;border-radius:7px;cursor:pointer;font-size:.84rem}
  .lg:hover{background:rgba(120,140,200,.12)} .lg.off{opacity:.32}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
  .lg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lg .ct{margin-left:auto;color:#7b88b0;font-size:.74rem}
  #tip{position:fixed;pointer-events:none;z-index:9;opacity:0;transform:translate(-50%,-140%);
    background:rgba(8,11,24,.92);border:1px solid rgba(140,160,220,.3);border-radius:9px;padding:.4rem .6rem;
    font-size:.86rem;max-width:280px;transition:opacity .12s}
  #tip b{display:block} #tip span{color:#9fb0d8;font-size:.76rem}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#8597c6;font-size:.95rem}
  .hint{color:#6b78a0;font-size:.76rem;margin-top:.3rem}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="loading">summoning the galaxy…</div>

<div id="head" class="panel" hidden>
  <h1>🌌 <span class="vlabel">vocabulary</span><select id="scheme" title="switch vocabulary / embedding"></select> <span id="count" class="sub"></span>
      <button id="info" class="ibtn" title="about &amp; controls" aria-label="about">ⓘ</button></h1>
  <div id="about" hidden>
    <p>Concepts placed by meaning — UMAP on MiniLM embeddings, coloured by theme. <a href="/">← skosdex</a></p>
    <p class="hint">drag to orbit · scroll to zoom · hover a star · click to open</p>
  </div>
</div>

<div id="ctrl" class="panel" hidden>
  <input id="q" type="search" placeholder="highlight…" autocomplete="off">
  <div class="seg"><button id="b3" class="on">3D</button><button id="b2">2D</button></div>
  <button class="btn" id="spin">⏸</button>
  <button class="btn" id="reset">reset</button>
</div>

<div id="legend" class="panel" hidden><h2><span class="caret">▾</span>themes</h2><div id="legitems"></div></div>
<div id="tip"></div>

<script>
  // Never hang silently on "summoning…": surface the real error (module/import
  // failure, WebGL, bad data, timeout) right in the loader so we can see it.
  window.__galaxyOK = false;
  function galaxyFail(msg){
    var l = document.getElementById('loading'); if (!l) return;
    l.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:1.2rem;text-align:center;color:#ff9b9b;font-size:.9rem;white-space:pre-wrap';
    l.textContent = '⚠ galaxy failed to load\n\n' + msg + '\n\nscheme: ' + (new URLSearchParams(location.search).get('scheme')||'gemet');
  }
  addEventListener('error', function(e){ if(!window.__galaxyOK) galaxyFail((e.message||'load error') + (e.filename ? '\n'+e.filename : '')); }, true);
  addEventListener('unhandledrejection', function(e){ if(!window.__galaxyOK){ var r=e.reason; galaxyFail(String(r&&(r.stack||r.message)||r||'promise rejected')); } });
  setTimeout(function(){ if(!window.__galaxyOK && document.getElementById('loading')) galaxyFail('timed out after 12s — the 3D engine (three.js CDN / import map) or the layout data did not load'); }, 12000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const slug = new URLSearchParams(location.search).get('scheme') || 'gemet';
const D = await (await fetch(`/embeddings/${slug}.layout.json`)).json();
const N = D.n, K = D.k;
const hex = h => new THREE.Color(h);
const palette = D.colors.map(hex);

// ---- scene / camera / renderer ----
const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0, 2.8);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.2);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.minDistance = 0.4; controls.maxDistance = 12;

// ---- soft round sprite for glowing points ----
function disc(){
  const s=64, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'), gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.85)');
  gr.addColorStop(.7,'rgba(255,255,255,.18)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}
const sprite = disc();

// ---- concept points ----
const pos3 = Float32Array.from(D.coords3);
const pos2 = new Float32Array(N*3);
for(let i=0;i<N;i++){ pos2[i*3]=D.coords2[i*2]; pos2[i*3+1]=D.coords2[i*2+1]; pos2[i*3+2]=0; }
// rescale each layout so the bulk (95th pct radius) fills the view — keeps rare
// outliers from compressing the core into a tiny dense blob.
function rescale(arr, target=1.3){
  const r=new Array(N); for(let i=0;i<N;i++) r[i]=Math.hypot(arr[i*3],arr[i*3+1],arr[i*3+2]);
  const p95=[...r].sort((a,b)=>a-b)[Math.floor(N*0.95)]||1, s=target/p95;
  for(let i=0;i<arr.length;i++) arr[i]*=s;
}
rescale(pos3); rescale(pos2);
const geo = new THREE.BufferGeometry();
const positions = pos3.slice();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const colArr = new Float32Array(N*3);
const baseCol = new Float32Array(N*3);
for(let i=0;i<N;i++){ const c=palette[D.cluster[i]]; colArr[i*3]=c.r; colArr[i*3+1]=c.g; colArr[i*3+2]=c.b; }
baseCol.set(colArr);
geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
const sizes = new Float32Array(N).fill(1);
geo.setAttribute('asize', new THREE.BufferAttribute(sizes, 1));

const mat = new THREE.ShaderMaterial({
  uniforms:{ tex:{value:sprite}, scale:{value:innerHeight*0.5} },
  vertexShader:`attribute float asize; varying vec3 vc;
    uniform float scale;
    void main(){ vc=color; vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize = (7.0*asize) * (scale/ -mv.z) / 90.0;
      gl_Position = projectionMatrix*mv; }`,
  fragmentShader:`uniform sampler2D tex; varying vec3 vc;
    void main(){ vec4 t=texture2D(tex,gl_PointCoord); if(t.a<0.02) discard;
      gl_FragColor = vec4(vc, t.a); }`,
  vertexColors:true, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
});
const points = new THREE.Points(geo, mat);
scene.add(points);

// ---- faint starfield backdrop for depth ----
(()=>{ const m=2200, g=new THREE.BufferGeometry(), p=new Float32Array(m*3);
  for(let i=0;i<m*3;i++) p[i]=(Math.random()-0.5)*40;
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x33406e,size:0.03,transparent:true,opacity:.5})));
})();

// reveal UI
window.__galaxyOK = true;   // reached the render path — silence the failure surfacing
document.getElementById('loading').remove();
for(const id of ['head','ctrl','legend']) document.getElementById(id).hidden=false;
// galaxy switcher: populate from the embeddings registry (skip the combined _all)
const schemeSel = document.getElementById('scheme');   // NB: not `pick` — a function pick(ev) already exists
const shortTitle = (t, s) => {
  if (!t) return s.toUpperCase().replace(/-/g, ' ');
  const head = t.split('—')[0].trim();                 // "GEMET — GEneral…" -> "GEMET"
  return head.length > 34 ? head.slice(0, 33) + '…' : head;
};
const optFor = (s, t) => { const o = document.createElement('option'); o.value = s;
  o.textContent = shortTitle(t, s); if (s === slug) o.selected = true; return o; };
Promise.all([
  fetch('/embeddings/index.json').then(r => r.json()).catch(() => [slug]),
  fetch('/manifest.json').then(r => r.json())
    .then(m => Object.fromEntries((m.included || []).map(x => [x.slug, x.title]))).catch(() => ({})),
]).then(([list, titles]) => {
  const galaxies = list.filter(x => !x.startsWith('_'));
  if (!galaxies.includes(slug)) galaxies.push(slug);
  for (const s of galaxies) schemeSel.appendChild(optFor(s, titles[s]));
});
schemeSel.onchange = () => { if (schemeSel.value && schemeSel.value !== slug) location.search = '?scheme=' + encodeURIComponent(schemeSel.value); };
document.getElementById('count').textContent = N.toLocaleString() + ' concepts';

// ---- declutter: details + controls hint live behind the ⓘ toggle; the theme
// legend collapses — so by default only the compact title, search, and view
// controls sit over the galaxy. ----
const about=document.getElementById('about'), info=document.getElementById('info');
info.onclick=()=>{ const show=about.hidden; about.hidden=!show; info.classList.toggle('on',show); };
const legend=document.getElementById('legend');
legend.querySelector('h2').onclick=()=>legend.classList.toggle('collapsed');

// ---- legend (click to isolate a theme) ----
const legitems = document.getElementById('legitems');
let isolated = -1;
D.clusterNames.forEach((nm,c)=>{
  const el=document.createElement('div'); el.className='lg'; el.dataset.c=c;
  el.innerHTML=`<span class="dot" style="color:${D.colors[c]}"></span><span class="nm">${nm}</span><span class="ct">${D.clusterSizes[c]}</span>`;
  el.onclick=()=>{ isolated = isolated===c? -1 : c; applyFilter();
    [...legitems.children].forEach(x=>x.classList.toggle('off', isolated>=0 && +x.dataset.c!==isolated)); };
  legitems.appendChild(el);
});

// ---- search + theme filter dim the colour buffer ----
const q = document.getElementById('q');
function applyFilter(){
  const term=q.value.trim().toLowerCase();
  for(let i=0;i<N;i++){
    let on = (isolated<0 || D.cluster[i]===isolated);
    if(on && term) on = D.labels[i].toLowerCase().includes(term);
    const k = on?1: (term||isolated>=0?0.06:1);
    colArr[i*3]=baseCol[i*3]*k; colArr[i*3+1]=baseCol[i*3+1]*k; colArr[i*3+2]=baseCol[i*3+2]*k;
    sizes[i] = on && (term||isolated>=0) ? 1.7 : 1;
  }
  geo.attributes.color.needsUpdate=true; geo.attributes.asize.needsUpdate=true;
}
q.addEventListener('input', applyFilter);

// ---- 2D / 3D morph ----
let target = pos3, morph = 1; // 1 = at target
function setDim(d){
  document.getElementById('b3').classList.toggle('on', d===3);
  document.getElementById('b2').classList.toggle('on', d===2);
  target = d===3? pos3 : pos2; morph = 0;
  controls.autoRotate = d===3;
  controls.enableRotate = d===3;
  if(d===2){ animTo(new THREE.Vector3(0,0,2.6), new THREE.Vector3(0,0,0)); }
}
document.getElementById('b3').onclick=()=>setDim(3);
document.getElementById('b2').onclick=()=>setDim(2);

let camAnim=null;
function animTo(p,t){ camAnim={p0:camera.position.clone(),p1:p,t0:controls.target.clone(),t1:t,s:0}; }
document.getElementById('reset').onclick=()=>{ animTo(new THREE.Vector3(0,0,2.8), new THREE.Vector3(0,0,0)); };
const spinBtn=document.getElementById('spin');
spinBtn.onclick=()=>{ controls.autoRotate=!controls.autoRotate; spinBtn.textContent=controls.autoRotate?'⏸':'▶'; };

// ---- hover + click ----
const ray=new THREE.Raycaster(); ray.params.Points.threshold=0.025;
const tip=document.getElementById('tip'); const mouse=new THREE.Vector2(); let hover=-1, downXY=null;
function pick(ev){ mouse.x=(ev.clientX/innerWidth)*2-1; mouse.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera); const h=ray.intersectObject(points); return h.length? h[0].index : -1; }
renderer.domElement.addEventListener('pointermove',ev=>{
  hover=pick(ev);
  if(hover>=0){ tip.style.left=ev.clientX+'px'; tip.style.top=ev.clientY+'px'; tip.style.opacity=1;
    tip.innerHTML=`<b>${D.labels[hover]}</b><span>${D.clusterNames[D.cluster[hover]]}</span>`;
    document.body.style.cursor='pointer'; }
  else { tip.style.opacity=0; document.body.style.cursor='default'; }
});
renderer.domElement.addEventListener('pointerdown',ev=>downXY=[ev.clientX,ev.clientY]);
renderer.domElement.addEventListener('pointerup',ev=>{
  if(!downXY) return; const moved=Math.hypot(ev.clientX-downXY[0],ev.clientY-downXY[1]); downXY=null;
  if(moved>6) return; const i=pick(ev);
  if(i>=0) window.open('/#c='+encodeURIComponent(D.ids[i]),'_blank');
});

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); mat.uniforms.scale.value=innerHeight*0.5; });

// ---- render loop ----
function tick(){
  requestAnimationFrame(tick);
  if(morph<1){ morph=Math.min(1,morph+0.04); const e=morph<.5?2*morph*morph:1-Math.pow(-2*morph+2,2)/2;
    for(let i=0;i<positions.length;i++) positions[i]+=(target[i]-positions[i])*0.18*(1);
    geo.attributes.position.needsUpdate=true; }
  if(camAnim){ camAnim.s=Math.min(1,camAnim.s+0.04); const e=1-Math.pow(1-camAnim.s,3);
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,e); controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);
    if(camAnim.s>=1) camAnim=null; }
  controls.update();
  composer.render();
}
tick();
</script>
</body>
</html>
