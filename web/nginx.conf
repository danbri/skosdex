server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Same-origin proxies so the browser avoids CORS.
    # SPARQL query endpoint -> http://localhost:8080/sparql/query
    location /sparql/ {
        proxy_pass http://sparql:7878/;
    }

    # Solr -> http://localhost:8080/solr/skos/select?q=...
    location /solr/ {
        proxy_pass http://solr:8983/solr/;
    }
}
