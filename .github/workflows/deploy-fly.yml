name: Deploy corpus to fly.io (Oxigraph + Solr)

# Two-stage deploy, proven 2026-06-09:
#   1. build-image: bake the corpus (Git LFS canonical.nq.gz -> bundle + solr
#      docs) into the Oxigraph+Solr image and push to GHCR. Needs only the
#      built-in GITHUB_TOKEN.
#   2. deploy: point the Fly app at that image. Needs FLY_API_TOKEN — an
#      app-scoped deploy token suffices, because deploying a prebuilt image
#      never touches Fly's builders (depot timed out and the classic builder
#      rejects app tokens; --image sidesteps both).
#
# First-boot seeding happens on the machine itself (deploy/fly/start.sh):
# oxigraph bulk-load + Solr index into the persistent volume, then serve.

on:
  workflow_dispatch:
  push:
    branches: [claude/main]
    paths:
      - 'third_party/skos/**/canonical.nq.gz'
      - 'scripts/skosdex'
      - 'deploy/fly/**'
      - '.github/workflows/deploy-fly.yml'

concurrency:
  group: fly-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git lfs pull

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Deploy artifacts from the committed LFS corpus — no network fetches.
      - run: node scripts/skosdex graphed
      - run: node scripts/skosdex solr-docs
      - name: Report artifact sizes
        run: |
          ls -la dist/graphed/ dist/solr-docs.json
          echo "quads: $(zcat dist/graphed/*.nq.gz | wc -l)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/skosdex-fly
          docker build -f deploy/fly/Dockerfile \
            -t "$IMG:latest" -t "$IMG:${{ github.sha }}" .
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # deploy scripts only (LFS off); full history,
        with:                       # pointer blobs only, to size the data delta
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Self-bootstrap app + volume if absent (idempotent).
      - name: Ensure app + volume exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: skosdex
          FLY_REGION: iad
        run: |
          set -euo pipefail
          flyctl status --app "$FLY_APP" >/dev/null 2>&1 \
            || flyctl apps create "$FLY_APP" --org contextris
          if ! flyctl volumes list --app "$FLY_APP" 2>/dev/null | grep -q skosdex_data; then
            flyctl volumes create skosdex_data --app "$FLY_APP" \
              --region "$FLY_REGION" --size 80 --yes
          fi

      # Deploy. Mode is auto-selected from the size of the DATA delta in this push
      # (sum of changed canonical.nq.gz, read from their LFS pointers — no pull):
      #  - DIRECT: small/code-only deltas. flyctl deploy in place; start.sh's
      #    optimize-gate skips compaction, so it's a fast reboot with no blackout.
      #  - CUTOVER: a large new/changed scheme (>= CUTOVER_BYTES) that would trigger
      #    a long on-prod optimize. deploy/fly/cutover.sh forks the prod volume,
      #    seeds+optimizes on a temp machine while prod serves, then swaps —
      #    zero downtime for BIG data (Getty TGN etc.).
      # Override the auto choice any time with repo var CUTOVER = 1 | 0 | dry.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: skosdex
          FLY_REGION: iad
          IMAGE: ghcr.io/${{ github.repository_owner }}/skosdex-fly:${{ github.sha }}
          CUTOVER: ${{ vars.CUTOVER || 'auto' }}
          CUTOVER_BYTES: ${{ vars.CUTOVER_BYTES || '52428800' }}   # 50 MB gz
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mode="${CUTOVER}"
          if [ "$mode" = "auto" ]; then
            # Diff the whole push (before..HEAD) so the data commit is included
            # regardless of ordering; fall back to HEAD^ for manual dispatch.
            base="${BEFORE:-}"
            case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD^";; esac
            git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1 || base="HEAD^"
            # Sum the gzipped sizes of canonical.nq.gz changed in this push, read
            # straight from the LFS pointer blobs (`size N` line) — no LFS content.
            bytes=0
            for f in $(git diff --name-only "$base" HEAD -- 'third_party/skos/**/canonical.nq.gz' 2>/dev/null || true); do
              sz=$(git show "HEAD:$f" 2>/dev/null | sed -n 's/^size //p' | head -1)
              [ -n "$sz" ] && bytes=$((bytes + sz))
            done
            if [ "$bytes" -ge "${CUTOVER_BYTES}" ]; then mode=1; else mode=0; fi
            echo "::notice::auto deploy: base=$base changed canonical bytes=$bytes (threshold ${CUTOVER_BYTES}) -> $([ "$mode" = 1 ] && echo CUTOVER || echo DIRECT)"
          fi
          case "${mode}" in
            1)   echo "::notice::zero-downtime cutover (big-data deploy)"; bash deploy/fly/cutover.sh ;;
            dry) echo "::notice::cutover DRY RUN"; bash deploy/fly/cutover.sh --no-swap ;;
            *)   echo "::notice::direct deploy (optimize-gate skips compaction for small deltas)";
                 flyctl deploy --image "$IMAGE" --config deploy/fly/fly.toml --strategy immediate --app "$FLY_APP" ;;
          esac
