name: Deploy corpus to fly.io (Oxigraph + Solr)

# Two-stage deploy, proven 2026-06-09:
#   1. build-image: bake the corpus (Git LFS canonical.nq.gz -> bundle + solr
#      docs) into the Oxigraph+Solr image and push to GHCR. Needs only the
#      built-in GITHUB_TOKEN.
#   2. deploy: point the Fly app at that image. Needs FLY_API_TOKEN — an
#      app-scoped deploy token suffices, because deploying a prebuilt image
#      never touches Fly's builders (depot timed out and the classic builder
#      rejects app tokens; --image sidesteps both).
#
# First-boot seeding happens on the machine itself (deploy/fly/start.sh):
# oxigraph bulk-load + Solr index into the persistent volume, then serve.

on:
  workflow_dispatch:
    inputs:
      cutover:
        description: 'Deploy mode (auto = size-based; 1 = force zero-downtime cutover; 0 = direct; dry = cutover without swap)'
        type: choice
        options: [auto, '1', '0', dry]
        default: auto
  push:
    branches: [claude/main]
    paths:
      - 'third_party/skos/**/canonical.nq.gz'
      - 'scripts/skosdex'
      - 'deploy/fly/**'
      # baked into the image (embeddings API server + query-embed sidecar + model)
      - 'tools/embed_api.mjs'
      - 'tools/embed_query.py'
      - 'tools/embed_model.py'
      - '.github/workflows/deploy-fly.yml'

concurrency:
  group: fly-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      ui_only: ${{ steps.scope.outputs.ui_only }}
    steps:
      # GitHub-hosted runners have ~14 GB free on /, but a full build now juggles
      # ~6 GB dist artifacts + ~3.5 GB LFS + a ~4.5 GB image (per-language Solr
      # docs roughly tripled the part payload), exhausting the disk during docker
      # build/push. Reclaim ~25 GB of preinstalled toolchains we never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/lib/node_modules/npm/changelogs || true
          sudo docker image prune -af || true
          df -h /
      # Cheap checkout first (no LFS smudge) so we can decide whether this push
      # even needs the corpus. A push that only touches deploy/fly/www/** is a
      # static-site change: the corpus is unchanged, so we skip the 3.7 GB LFS
      # pull, graphed/solr-docs, and the 2 GB image rebuild, and instead layer
      # the new www onto :latest (Dockerfile.ui). UI tweak: ~1-2 min, not ~50.
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Classify change scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BEFORE:-}"
          case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD^";; esac
          git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1 || base="HEAD^"
          changed=$(git diff --name-only "$base" HEAD || true)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Manual dispatch only sees the last commit (HEAD^), an unreliable basis
          # for the UI-fast-path decision — so always do a FULL corpus build on a
          # manual run (safe: the image is guaranteed to carry the current corpus).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ui_only=false" >> "$GITHUB_OUTPUT"; echo "::notice::manual dispatch — full build (corpus artifacts)"
          # UI-only iff there is at least one change and every change is under www.
          elif [ -n "$changed" ] && ! echo "$changed" | grep -qv '^deploy/fly/www/'; then
            echo "ui_only=true" >> "$GITHUB_OUTPUT"; echo "::notice::UI-only push — fast path (skip corpus rebuild)"
          else
            echo "ui_only=false" >> "$GITHUB_OUTPUT"; echo "::notice::full build (corpus artifacts)"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.ui_only != 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.scope.outputs.ui_only != 'true'
        run: npm ci

      # Cache the LFS object store so unchanged canonicals aren't re-downloaded
      # every build (faster, and saves the repo's LFS bandwidth budget). Keyed on
      # the committed pointers, which carry each object's content oid.
      - name: Cache LFS objects
        if: steps.scope.outputs.ui_only != 'true'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('third_party/skos/**/canonical.nq.gz') }}
          restore-keys: lfs-
      - if: steps.scope.outputs.ui_only != 'true'
        run: git lfs pull

      # Cache the per-scheme graphed artifacts. `skosdex graphed` reuses any
      # scheme whose canonical is unchanged (sidecar hash match), so restoring
      # the previous run's dist/graphed makes a one-scheme data change re-graph
      # only that scheme instead of the whole corpus. Unique key + restore-keys
      # prefix = always restore the latest, always save a fresh snapshot.
      - name: Cache graphed + solr-docs artifacts (incremental rebuild)
        if: steps.scope.outputs.ui_only != 'true'
        uses: actions/cache@v4
        with:
          path: |
            dist/graphed
            dist/solr-cache
          key: artifacts-${{ github.sha }}
          restore-keys: artifacts-
      - if: steps.scope.outputs.ui_only != 'true'
        run: node scripts/skosdex graphed
      - if: steps.scope.outputs.ui_only != 'true'
        run: node scripts/skosdex solr-docs
      - name: Report artifact sizes
        if: steps.scope.outputs.ui_only != 'true'
        run: |
          ls -la dist/graphed/ dist/solr-docs.json
          echo "quads: $(zcat dist/graphed/*.nq.gz | wc -l)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository_owner }}/skosdex-fly
          if [ "${{ steps.scope.outputs.ui_only }}" = "true" ]; then
            # Thin image: new www layered onto the last full image (corpus intact).
            docker pull "$IMG:latest"
            docker build -f deploy/fly/Dockerfile.ui --build-arg BASE="$IMG:latest" \
              -t "$IMG:latest" -t "$IMG:${{ github.sha }}" .
          else
            # The image bakes only dist/solr-parts + dist/graphed — drop the ~2 GB
            # monolithic solr-docs.json before the build so it doesn't sit in the
            # build context / eat runner disk.
            rm -f dist/solr-docs.json
            docker build -f deploy/fly/Dockerfile \
              -t "$IMG:latest" -t "$IMG:${{ github.sha }}" .
          fi
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # deploy scripts only (LFS off); full history,
        with:                       # pointer blobs only, to size the data delta
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Self-bootstrap app + volume if absent (idempotent).
      - name: Ensure app + volume exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: skosdex
          FLY_REGION: iad
        run: |
          set -euo pipefail
          flyctl status --app "$FLY_APP" >/dev/null 2>&1 \
            || flyctl apps create "$FLY_APP" --org contextris
          if ! flyctl volumes list --app "$FLY_APP" 2>/dev/null | grep -q skosdex_data; then
            flyctl volumes create skosdex_data --app "$FLY_APP" \
              --region "$FLY_REGION" --size 80 --yes
          fi

      # Deploy. Mode is auto-selected from the size of the DATA delta in this push
      # (sum of changed canonical.nq.gz, read from their LFS pointers — no pull):
      #  - DIRECT: small/code-only deltas. flyctl deploy in place; start.sh's
      #    optimize-gate skips compaction, so it's a fast reboot with no blackout.
      #  - CUTOVER: a large new/changed scheme (>= CUTOVER_BYTES) that would trigger
      #    a long on-prod optimize. deploy/fly/cutover.sh forks the prod volume,
      #    seeds+optimizes on a temp machine while prod serves, then swaps —
      #    zero downtime for BIG data (Getty TGN etc.).
      # Override the auto choice any time with repo var CUTOVER = 1 | 0 | dry.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: skosdex
          FLY_REGION: iad
          IMAGE: ghcr.io/${{ github.repository_owner }}/skosdex-fly:${{ github.sha }}
          CUTOVER: ${{ github.event.inputs.cutover || vars.CUTOVER || 'auto' }}
          CUTOVER_BYTES: ${{ vars.CUTOVER_BYTES || '52428800' }}   # 50 MB gz
          BEFORE: ${{ github.event.before }}
          UI_ONLY: ${{ needs.build-image.outputs.ui_only }}
        run: |
          set -euo pipefail
          mode="${CUTOVER}"
          # UI fast path: corpus untouched, so never cut over — just reboot onto
          # the thin image. (start.sh sees identical /seed, skips loads+optimize.)
          [ "$UI_ONLY" = "true" ] && mode=0
          if [ "$mode" = "auto" ]; then
            # Diff the whole push (before..HEAD) so the data commit is included
            # regardless of ordering; fall back to HEAD^ for manual dispatch.
            base="${BEFORE:-}"
            case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD^";; esac
            git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1 || base="HEAD^"
            # Sum the gzipped sizes of canonical.nq.gz changed in this push, read
            # straight from the LFS pointer blobs (`size N` line) — no LFS content.
            bytes=0
            for f in $(git diff --name-only "$base" HEAD -- 'third_party/skos/**/canonical.nq.gz' 2>/dev/null || true); do
              sz=$(git show "HEAD:$f" 2>/dev/null | sed -n 's/^size //p' | head -1)
              [ -n "$sz" ] && bytes=$((bytes + sz))
            done
            if [ "$bytes" -ge "${CUTOVER_BYTES}" ]; then mode=1; else mode=0; fi
            echo "::notice::auto deploy: base=$base changed canonical bytes=$bytes (threshold ${CUTOVER_BYTES}) -> $([ "$mode" = 1 ] && echo CUTOVER || echo DIRECT)"
          fi
          case "${mode}" in
            1)   echo "::notice::zero-downtime cutover (big-data deploy)"; bash deploy/fly/cutover.sh ;;
            dry) echo "::notice::cutover DRY RUN"; bash deploy/fly/cutover.sh --no-swap ;;
            *)   echo "::notice::direct deploy (optimize-gate skips compaction for small deltas)";
                 flyctl deploy --image "$IMAGE" --config deploy/fly/fly.toml --strategy immediate --app "$FLY_APP" ;;
          esac
          # To watch the on-box seed/reindex after a deploy, tail the machine
          # directly: `fly logs -a skosdex | grep '\[solr-seed\]'` (needs a Fly
          # token; see skills/deploy-fly/SKILL.md "Debugging the live box").
