name: Deploy corpus to fly.io (Oxigraph + Solr)

# Two-stage deploy, proven 2026-06-09:
#   1. build-image: bake the corpus (Git LFS canonical.nq.gz -> bundle + solr
#      docs) into the Oxigraph+Solr image and push to GHCR. Needs only the
#      built-in GITHUB_TOKEN.
#   2. deploy: point the Fly app at that image. Needs FLY_API_TOKEN — an
#      app-scoped deploy token suffices, because deploying a prebuilt image
#      never touches Fly's builders (depot timed out and the classic builder
#      rejects app tokens; --image sidesteps both).
#
# First-boot seeding happens on the machine itself (deploy/fly/start.sh):
# oxigraph bulk-load + Solr index into the persistent volume, then serve.

on:
  workflow_dispatch:
  push:
    branches: [claude/main]
    paths:
      - 'third_party/skos/**/canonical.nq.gz'
      - 'scripts/skosdex'
      - 'deploy/fly/**'
      - '.github/workflows/deploy-fly.yml'

concurrency:
  group: fly-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git lfs pull

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Deploy artifacts from the committed LFS corpus — no network fetches.
      - run: node scripts/skosdex graphed
      - run: node scripts/skosdex solr-docs
      - name: Report artifact sizes
        run: |
          ls -la dist/graphed/ dist/solr-docs.json
          echo "quads: $(zcat dist/graphed/*.nq.gz | wc -l)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/skosdex-fly
          docker build -f deploy/fly/Dockerfile \
            -t "$IMG:latest" -t "$IMG:${{ github.sha }}" .
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for deploy/fly/fly.toml only (no LFS)
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Self-bootstrap app + volume if absent (idempotent).
      - name: Ensure app + volume exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: skosdex
          FLY_REGION: iad
        run: |
          set -euo pipefail
          flyctl status --app "$FLY_APP" >/dev/null 2>&1 \
            || flyctl apps create "$FLY_APP" --org contextris
          if ! flyctl volumes list --app "$FLY_APP" 2>/dev/null | grep -q skosdex_data; then
            flyctl volumes create skosdex_data --app "$FLY_APP" \
              --region "$FLY_REGION" --size 80 --yes
          fi

      # Deploy. Two paths:
      #  - DIRECT (default): flyctl deploy in place. start.sh's optimize-gate skips
      #    the expensive compaction for small/code-only deltas, so it's a fast
      #    reboot with no blackout. Right for UI/config changes and small data.
      #  - CUTOVER (set repo var CUTOVER=1, or --no-swap dry run via CUTOVER=dry):
      #    deploy/fly/cutover.sh forks the prod volume, seeds+optimizes it on a
      #    temp machine while prod serves, then swaps — zero downtime for BIG data
      #    deltas (Getty TGN etc.) that would otherwise trigger a long optimize.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: skosdex
          FLY_REGION: iad
          IMAGE: ghcr.io/${{ github.repository_owner }}/skosdex-fly:${{ github.sha }}
          CUTOVER: ${{ vars.CUTOVER || '0' }}
        run: |
          set -euo pipefail
          case "${CUTOVER}" in
            1)   echo "::notice::zero-downtime cutover (big-data deploy)"; bash deploy/fly/cutover.sh ;;
            dry) echo "::notice::cutover DRY RUN"; bash deploy/fly/cutover.sh --no-swap ;;
            *)   echo "::notice::direct deploy (optimize-gate skips compaction for small deltas)";
                 flyctl deploy --image "$IMAGE" --config deploy/fly/fly.toml --strategy immediate --app "$FLY_APP" ;;
          esac
