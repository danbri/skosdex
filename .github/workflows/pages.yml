name: Deploy demo to GitHub Pages

# Publishes the COMMITTED docs/ directory to GitHub Pages (Pages source is
# "GitHub Actions" for this repo, so this workflow is the only publish path).
#
# docs/ carries only small authored/derived files (landing page, manifest,
# background notes) — the full corpus and interactive demo are served by the
# fly.io deployment. Nothing here needs npm, Git LFS, or the data pipeline:
# an earlier version rebuilt the bundle in CI and broke permanently once the
# corpus moved to LFS (zcat on LFS pointer files). Refresh docs/ locally with
# `npm run site` and commit.

on:
  push:
    branches: [claude/main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Provision the Pages site if it isn't already enabled, so the deploy
      # step has a target (symptom otherwise: deploy fails fast, GET /pages 404).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
